[project]
name = "finanalysis"
version = "0.1.0"
description = "Technical-analysis chart generator for market tickers."
requires-python = ">=3.10"
dependencies = [
    "yfinance>=0.2,<1.0",
    "plotly>=5.18,<6.0",
    "pandas>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "pykrx>=1.0,<2.0",
    "requests>=2.28,<3.0",
    "jinja2>=3.1,<4.0",
    "setuptools<81",
    "pywin32>=306",
]

[project.scripts]
finanalysis = "src.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
